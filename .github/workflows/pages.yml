name: Publish demo

# Copies the demo/ folder to the gh-pages branch.
# GitHub Pages then serves that branch (Settings → Pages → Deploy from a branch → gh-pages / root).

on:
  push:
    branches: [main]
    paths: ["demo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish demo/ to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd demo
          # Stamp every asset link with this commit, so browsers never keep an old stylesheet or script.
          sed -i "s/__V__/${GITHUB_SHA::8}/g" index.html
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish demo from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" gh-pages
          echo "Published. Site: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${REPO#*/}/" >> "$GITHUB_STEP_SUMMARY"
